<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Diners are on their own phones, so the viewport is the real layout
         constraint. maximum-scale is deliberately NOT set: pinch-zoom is an
         accessibility feature and disabling it on a menu is hostile. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0f172a" />
    <title>Order at your table</title>
  </head>
  <body>
    <div id="guest-root"></div>
    <script type="module" src="/src/guest/main.tsx"></script>
  </body>
</html>
